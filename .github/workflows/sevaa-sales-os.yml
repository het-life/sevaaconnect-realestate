name: SEVAA Sales OS CI

on:
  push:
    branches:
      - main
      - feat/sevaa-sales-os-mvp
    paths:
      - 'sevaa-sales-os/**'
      - '.github/workflows/sevaa-sales-os.yml'
  pull_request:
    paths:
      - 'sevaa-sales-os/**'
      - '.github/workflows/sevaa-sales-os.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sevaa-sales-os
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile backend and revenue modules
        run: |
          python -m py_compile backend/*.py
          python -m py_compile scripts/*.py

      - name: Run tests
        run: python -m pytest -q
