name: SEVAA Sales OS CI

on:
  push:
    branches:
      - main
      - feat/sevaa-sales-os-mvp
    paths:
      - 'sevaa-sales-os/**'
      - '.github/workflows/sevaa-sales-os.yml'
  pull_request:
    paths:
      - 'sevaa-sales-os/**'
      - '.github/workflows/sevaa-sales-os.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sevaa-sales-os
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile backend and automation modules
        run: |
          python -m py_compile backend/*.py
          python -m py_compile scripts/*.py

      - name: Run tests
        run: python -m pytest -q

      - name: Validate Compose profile
        run: docker compose config --quiet

      - name: Build deployment image
        run: docker build --tag sevaa-sales-os:ci .

      - name: Smoke-test container health
        run: |
          docker run --detach --name sevaa-sales-os-ci \
            --publish 127.0.0.1:18000:8000 \
            --env SEVAA_FOUNDER_TOKEN=ci-founder-token \
            --env SEVAA_AUTOMATION_TOKEN=ci-automation-token \
            sevaa-sales-os:ci
          trap 'docker rm --force sevaa-sales-os-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs sevaa-sales-os-ci
          exit 1

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sevaa_ci
          POSTGRES_USER: sevaa_ci
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sevaa_ci -d sevaa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: sevaa-sales-os
    env:
      PYTHONPATH: .
      SEVAA_DATABASE_URL: postgresql://sevaa_ci:ci-postgres-password@127.0.0.1:5432/sevaa_ci
      SEVAA_FOUNDER_TOKEN: ci-founder-token
      SEVAA_AUTOMATION_TOKEN: ci-automation-token
      SEVAA_ALLOW_LEGACY_V1: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile PostgreSQL compatibility layer
        run: |
          python -m py_compile backend/database.py backend/migration_runtime.py
          python -m py_compile tests/test_postgres_runtime.py

      - name: Run PostgreSQL hardened-flow integration
        run: python -m pytest -q tests/test_postgres_runtime.py
